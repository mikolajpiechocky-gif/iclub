name: TAURUS sync (dziennie)

# Raz dziennie 04:00 UTC: potwierdzone przyszle eventy iClub trafiaja do kalendarza TAURUS.
# Endpoint chroniony sekretem OLX_CRON_SECRET.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: taurus-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Ping taurus sync endpoint
        env:
          CRON_SECRET: ${{ secrets.OLX_CRON_SECRET }}
        run: |
          code=$(curl -sS -o response.json -w "%{http_code}" -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://app.iclubevents.pl/api/taurus/sync")
          echo "HTTP ${code}"
          cat response.json || true
          echo ""
          if [ "${code}" != "200" ]; then echo "::warning::HTTP ${code} - nie przerywam joba (status w body/apce)"; fi
