name: Alert wyjazdu (co 30 min)

# Co 30 minut w godzinach 5–20 UTC (7–22 PL): alert „pracownik powinien już jechać".
# Endpoint chroniony sekretem OLX_CRON_SECRET.
# UWAGA: przypomnienia o nieodpisanych leadach zostały WYŁĄCZONE (spam) — szef dostaje
# push od razu przy nowym zgłoszeniu z konfiguratora. Aby wrócić do przypominajek: dodaj
# tryb `leads` z powrotem tutaj oraz ustaw LEAD_REMINDERS_ENABLED=1 w środowisku.
on:
  schedule:
    - cron: "*/30 5-20 * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: departure-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping departure
        env:
          CRON_SECRET: ${{ secrets.OLX_CRON_SECRET }}
        run: |
          code=$(curl -sS -o response.json -w "%{http_code}" -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://app.iclubevents.pl/api/notifications/sweep?mode=departure")
          echo "[departure] HTTP ${code}"
          cat response.json || true
          echo ""
          if [ "${code}" != "200" ]; then echo "::warning::[departure] HTTP ${code} — nie przerywam joba (status w body/apce)"; fi
